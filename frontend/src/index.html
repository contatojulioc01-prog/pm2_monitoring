<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PM2 Manager</title>
  <base href="/">
  <script>
    // Ajuste dinâmico de base href conforme o subcaminho do proxy reverso
    (function() {
      var p = window.location.pathname;
      var base = document.querySelector('base');
      if (base) {
        if (p.indexOf('/pm2-manager') !== -1) {
          base.setAttribute('href', '/pm2-manager/');
        } else if (p.indexOf('/doce-manager') !== -1) {
          base.setAttribute('href', '/doce-manager/');
        }
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>

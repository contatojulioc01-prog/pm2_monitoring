<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PM2 Manager</title>
  <script>
    // Detecção dinâmica de base href (funciona por porta direta ex: :6767 ou por subcaminho /pm2-manager/)
    (function() {
      var p = window.location.pathname;
      if (p.length > 1 && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
        window.location.replace(p + '/' + window.location.search + window.location.hash);
        return;
      }
      var isPm2 = p.startsWith('/pm2-manager');
      var baseHref = isPm2 ? '/pm2-manager/' : '/';
      var baseTag = document.querySelector('base');
      if (baseTag) {
        baseTag.setAttribute('href', baseHref);
      }
    })();
  </script>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
